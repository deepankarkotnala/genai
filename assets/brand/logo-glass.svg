<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Switch job</title>
  <desc id="desc">An original multicolor app-style switch symbol.</desc>
  <defs>
    <linearGradient id="bg" x1="7" y1="5" x2="57" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <linearGradient id="warm" x1="12" y1="12" x2="49" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff7a18"/>
