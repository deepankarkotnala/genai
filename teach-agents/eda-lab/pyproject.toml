[project]
name = "eda-lab"
version = "1.0.0"
description = "Supplementary interview lab: an EDA agent that plans with a local Gemma model and computes with pandas"
requires-python = ">=3.10"

# All already present in a standard Anaconda install; pinned as floors, not
# as an install step.
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pydantic>=2.0",
    "requests>=2.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ollama: requires a running Ollama service and an installed Gemma model",
]
# Integration tests are excluded by default, so `python -m pytest` is always
# offline and deterministic. Run them deliberately with `-m ollama`.
addopts = '-m "not ollama"'
