<style>
  :root{color-scheme:light;--canvas:#f3f4f6;--panel:#fff;--line:#e0e3e8;--text:#20232b;--soft:#505665;--muted:#7b8290;--accent:#5b45d8;--excel:#107c41;--surface:#f8f9fb}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--canvas)}
  body{display:grid;place-items:center;min-width:320px;padding:20px;color:var(--text);font:13.5px/1.55 "Segoe UI Variable","Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .glass{width:min(430px,100%);overflow:hidden;border:1px solid var(--line);border-radius:9px;background:var(--panel);box-shadow:0 1px 2px rgba(22,27,35,.05),0 10px 28px rgba(22,27,35,.05);text-align:left}
  .titlebar{height:40px;display:flex;align-items:center;padding:0 13px;border-bottom:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:11px}
  .body{padding:26px}
  .mark{width:min(300px,100%);height:auto;margin:0 0 18px}.mark img{display:block;width:100%;height:auto}
  h1{margin:0 0 5px;font-size:22px;line-height:1.2;letter-spacing:-.025em;font-weight:650}
  p{margin:0;color:var(--soft)}
  .bar{height:3px;margin:20px 0 14px;overflow:hidden;border-radius:3px;background:var(--line)}
  .bar i{display:block;width:42%;height:100%;border-radius:inherit;background:var(--excel);animation:load 1.15s ease-in-out infinite}
  a{color:var(--accent);font-weight:650;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
  @keyframes load{from{transform:translateX(-115%)}to{transform:translateX(340%)}}
  @media(prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style>
</head>
<body>
  <main class="glass">
    <div class="titlebar">Interview Preparation · Learning workspace</div>
    <div class="body">
    <div class="mark"><img src="assets/brand/logo-glass.svg" alt="Interview Preparation"></div>
    <h1>Interview Preparation</h1>
    <p>Opening your GenAI learning and interview workspace…</p>
    <div class="bar" aria-hidden="true"><i></i></div>
    <p><a href="genai-portal/index.html">Open the hub now →</a></p>
    </div>
  </main>
  <script>setTimeout(function(){location.replace("genai-portal/index.html"+(location.hash||""));},1100);</script>
</body>
